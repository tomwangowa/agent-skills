workflows:

  - id: tech-evaluation
    label: 技術評估（快速）
    when: 評估一個技術方案是否可行，需要驗證假設
    steps:
      - tech-feasibility
      - assumption-extractor
      - micro-poc-validator

  - id: full-research
    label: 完整研究流程（8 階段）
    when: 重大技術決策，需要嚴謹求證與多方交叉驗證
    steps:
      - tech-research-pipeline

  - id: feature-dev
    label: 功能開發全流程
    when: 從需求探索到交付的完整開發週期
    steps:
      - brainstorming
      - superpowers:writing-plans
      - superpowers:executing-plans
      - completion-gate
      # Review is selected by skill-router from the active runtime.

  - id: presentation
    label: 簡報製作
    when: 準備演講、分享、或任何簡報
    steps:
      - presentation-planner
      - interactive-presentation-generator

  - id: post-implementation
    label: 實作完成後驗收
    when: 代碼寫完，準備 review 和合併
    steps:
      - completion-gate
      # Review is selected by skill-router from the active runtime.
      - superpowers:finishing-a-development-branch

  - id: role-pipeline
    label: PM→RD 角色協作
    when: 需要完整的需求分析到技術設計流程
    steps:
      - role-orchestrator
